# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5
}

order += "cpu_temperature 0"
order += "cpu_temperature 1"
order += "cpu_usage"
order += "memory"
order += "disk /"
order += "ethernet _first_"
order += "wireless _first_"
order += "load"
order += "volume master"
order += "tztime local"

cpu_temperature 0 {
    format = "CPU %degrees °C"
    path = "/sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon2/temp1_input"
    max_threshold = 75
}

cpu_temperature 1 {
    format = "GPU %degrees °C"
    path = "/sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon2/temp3_input"
    max_threshold = 75
}

cpu_usage {
  format = "CPU %usage"
  degraded_threshold = 50
  max_threshold = 80
}

memory {
    memory_used_method = "classical" # Matches gnome-system-monitor
    # Alternative: memory_used_method = "memavailable"
    format = "RAM: %used / %total"
}

disk "/" {
        format = "Porn Folder: %avail"
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        # format_up = "E: %ip (%speed)"
        format_up = "E: Leaked IP: %ip (%speed)"
        format_down = "E: down"
}

wireless _first_ {
        # format_up = "W: (%quality at %essid) %ip"
        format_up = "W: (%quality) Leaked IP: %ip"
        format_down = "W: down"
}

load {
    format = "[ load: %1min, %5min, %15min ]"
}

volume master {
        format = "♪: %volume"
        format_muted = "♪: muted (%volume)"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}
